name: Keep Supabase Alive

# Supabase 무료 플랜은 7일간 DB 활동이 없으면 프로젝트가 자동 일시정지됨.
# 그보다 짧은 주기로 간단한 조회 요청을 보내 활동을 유지한다.
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -o /dev/null \
            "${{ secrets.KEEPALIVE_SUPABASE_URL }}/rest/v1/holidays?select=date&limit=1" \
            -H "apikey: ${{ secrets.KEEPALIVE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.KEEPALIVE_SUPABASE_ANON_KEY }}"
