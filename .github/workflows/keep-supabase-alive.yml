name: Keep Supabase Alive

# Supabase 무료 플랜은 7일간 DB 활동이 없으면 프로젝트가 자동 일시정지됨.
# 그보다 짧은 주기로 간단한 조회 요청을 보내 활동을 유지한다.
# 겸사겸사 GitHub Actions 예약 실행 자체가 "저장소 60일 비활동 시 자동 비활성화"
# 정책의 대상이라, 마지막 커밋으로부터 20일 넘게 지났으면 아주 작은 커밋을 하나
# 남겨 저장소 활동도 같이 유지한다(매번 커밋하지 않고, 조용할 때만).
on:
  schedule:
    - cron: '40 14 * * *' # TEMP: 자동 스케줄 트리거 검증용, 확인 후 원복 예정
  workflow_dispatch:
    inputs:
      force_commit:
        description: '20일 안 지났어도 keepalive 커밋 강제 실행(테스트용)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase REST API
        run: |
          curl -sf -o /dev/null \
            "${{ secrets.KEEPALIVE_SUPABASE_URL }}/rest/v1/holidays?select=date&limit=1" \
            -H "apikey: ${{ secrets.KEEPALIVE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.KEEPALIVE_SUPABASE_ANON_KEY }}"

      - name: Keep repo active if quiet for 20+ days
        run: |
          LAST_COMMIT_EPOCH=$(git log -1 --format=%ct)
          NOW_EPOCH=$(date +%s)
          DAYS_SINCE=$(( (NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400 ))
          echo "마지막 커밋 이후 ${DAYS_SINCE}일 경과"
          if [ "$DAYS_SINCE" -ge 20 ] || [ "${{ inputs.force_commit }}" = "true" ]; then
            mkdir -p .github
            echo "Last keepalive commit: $(date -u +%Y-%m-%dT%H:%M:%SZ) (repo was quiet for ${DAYS_SINCE}+ days)" > .github/keepalive-marker.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive-marker.txt
            git commit -m "chore: keepalive marker (repo quiet for ${DAYS_SINCE}+ days)"
            git push
          else
            echo "아직 ${DAYS_SINCE}일밖에 안 지나서 커밋 안 함"
          fi
